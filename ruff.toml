# Repo-pinned lint config: without this, local/user configs decide what "ruff check"
# means and CI would disagree with the developer's machine.
line-length = 110
target-version = "py38"

[lint]
# The rules this codebase is held to: pycodestyle errors (E4/E7/E9), pyflakes (F)
# and pyflakes-only warnings (W). Deliberately NOT the full defaults-plus-opinion set
# (root logging, bare excepts elsewhere, ...) - those are read-and-warned about, not gated.
select = ["E4", "E7", "E9", "F", "W"]
