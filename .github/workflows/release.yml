# Tag-only release pipeline. The checks themselves live in ci.yml and are pulled
# in as a reusable workflow, so a tag build cannot publish an artifact that the
# normal CI would have rejected, and ci.yml stays free of a tag-guarded job that
# shows up as "skipped" on every branch push.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    name: Checks (reusable CI)
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the release
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Tag must match the package version
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from dataguard import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.lstrip("v") != __version__:
              sys.exit(f"{tag} does not match __version__ {__version__}")
          print("tag", tag, "== __version__", __version__)
          PY
      - name: Build the release file
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip -o "dist/dataguard-${GITHUB_REF_NAME}.zip" HEAD dataguard dataguard.py
          python -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); assert 'dataguard.py' in n and 'dataguard/__init__.py' in n and 'dataguard/dashboard.html' in n, n; print(len(n), 'files')" "dist/dataguard-${GITHUB_REF_NAME}.zip"
      - name: Build the setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          ./installer/build.ps1 -Version $env:GITHUB_REF_NAME -Python python
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "dist/dataguard-${GITHUB_REF_NAME}.zip"
          "dist/DataGuard-Setup-${GITHUB_REF_NAME}.exe"
          --title "$GITHUB_REF_NAME"
          --generate-notes
