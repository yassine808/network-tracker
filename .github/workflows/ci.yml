name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the one runtime package
        run: pip install psutil
      - name: Byte-compile every module
        run: python -m compileall -q dataguard dataguard.py
      - name: Smoke tests
        run: python tests/smoke.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Tag must match the package version
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from dataguard import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.lstrip("v") != __version__:
              sys.exit(f"{tag} does not match __version__ {__version__}")
          print("tag", tag, "== __version__", __version__)
          PY
      - name: Build the release file
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip -o "dist/dataguard-${GITHUB_REF_NAME}.zip" HEAD dataguard dataguard.py
          python -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); assert 'dataguard.py' in n and 'dataguard/__init__.py' in n and 'dataguard/dashboard.html' in n, n; print(len(n), 'files')" "dist/dataguard-${GITHUB_REF_NAME}.zip"
      - name: Build the setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          ./installer/build.ps1 -Version $env:GITHUB_REF_NAME -Python python
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "dist/dataguard-${GITHUB_REF_NAME}.zip"
          "dist/DataGuard-Setup-${GITHUB_REF_NAME}.exe"
          --title "$GITHUB_REF_NAME"
          --generate-notes
